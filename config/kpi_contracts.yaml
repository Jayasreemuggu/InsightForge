kpis:

  revenue:
    display_name: "Revenue"
    description: "Total revenue generated during the selected period."

    data_type: "currency"
    unit: "INR"

    calculation:
      aggregation: "sum"
      column: "revenue"

    grain:
      time: "monthly"
      geography: "region"

    comparison:
      method: "month_over_month"

    materiality:
      percentage_threshold: 10
      absolute_threshold: 10000

    drivers:
      - product_usage
      - renewal_rate
      - support_resolution_hours
      - orders

    source:
      system: "sales_system"
      dataset: "sales.csv"
      refresh_frequency: "monthly"
      expected_latency: "24h"

    lineage:
      source_type: "transactional"
      transformation: "monthly aggregation by region"
      analytical_method: "deterministic aggregation + statistical driver analysis"

    access:
      roles:
        - analyst
        - manager
        - executive


  orders:
    display_name: "Orders"
    description: "Total number of orders recorded during the selected period."

    data_type: "numeric"
    unit: "orders"

    calculation:
      aggregation: "sum"
      column: "orders"

    grain:
      time: "monthly"
      geography: "region"

    comparison:
      method: "month_over_month"

    materiality:
      percentage_threshold: 10
      absolute_threshold: 100

    drivers:
      - product_usage
      - renewal_rate
      - support_resolution_hours

    source:
      system: "sales_system"
      dataset: "sales.csv"
      refresh_frequency: "monthly"
      expected_latency: "24h"

    lineage:
      source_type: "transactional"
      transformation: "monthly aggregation by region"
      analytical_method: "deterministic aggregation + statistical driver analysis"

    access:
      roles:
        - analyst
        - manager
        - executive


  product_usage:
    display_name: "Product Usage"
    description: "Average product usage score for the selected region and period."

    data_type: "numeric"
    unit: "score"

    calculation:
      aggregation: "mean"
      column: "product_usage"

    grain:
      time: "monthly"
      geography: "region"

    comparison:
      method: "month_over_month"

    materiality:
      percentage_threshold: 10

    source:
      system: "product_analytics"
      dataset: "product_usage.csv"
      refresh_frequency: "daily"
      expected_latency: "6h"

    lineage:
      source_type: "product_analytics"
      transformation: "daily observations reconciled to monthly regional mean"
      analytical_method: "aggregation + correlation analysis"

    access:
      roles:
        - analyst
        - manager
        - executive


  renewal_rate:
    display_name: "Renewal Rate"
    description: "Percentage of customers renewing during the selected period."

    data_type: "percentage"
    unit: "%"

    calculation:
      aggregation: "mean"
      column: "renewal_rate"

    grain:
      time: "monthly"
      geography: "region"

    comparison:
      method: "month_over_month"

    materiality:
      percentage_threshold: 5

    source:
      system: "customer_success"
      dataset: "renewal_data.csv"
      refresh_frequency: "weekly"
      expected_latency: "48h"

    lineage:
      source_type: "customer_success"
      transformation: "weekly observations reconciled to monthly regional mean"
      analytical_method: "aggregation + correlation analysis"

    access:
      roles:
        - analyst
        - manager
        - executive


  support_resolution_hours:
    display_name: "Support Resolution Hours"
    description: "Average time required to resolve customer support tickets."

    data_type: "numeric"
    unit: "hours"

    calculation:
      aggregation: "mean"
      column: "support_resolution_hours"

    grain:
      time: "monthly"
      geography: "region"

    comparison:
      method: "month_over_month"

    materiality:
      percentage_threshold: 20

    source:
      system: "support_system"
      dataset: "support_tickets.csv"
      refresh_frequency: "daily"
      expected_latency: "6h"

    lineage:
      source_type: "support_operations"
      transformation: "ticket-level observations reconciled to monthly regional mean"
      analytical_method: "aggregation + correlation analysis"

    access:
      roles:
        - analyst
        - manager
        - executive